name: JEEDock
options:
  bundleIdPrefix: com.jeedock
  deploymentTarget:
    iOS: "15.0"
targets:
  JEEDock:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: JEEDock
      - path: www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: JEEDock
        PRODUCT_BUNDLE_IDENTIFIER: com.jeedock.app
        INFOPLIST_FILE: JEEDock/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
